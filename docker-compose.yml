# Логи каждого контейнера — не больше 5 файлов по 10 МБ (чтобы не заполнить диск)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    # Порт наружу НЕ открываем — база доступна только боту

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/bot/data
      - ./backups:/bot/backups:ro  # чтобы админ мог получить последнюю копию в Telegram
    logging: *logging

  web:
    # Веб-панель: тот же образ, что и бот, другая команда запуска. Только локальная сеть.
    build: .
    restart: unless-stopped
    env_file: .env
    # Наружу не открыта: к ней ходит только proxy (nginx с HTTPS). --proxy-headers — чтобы видеть IP сотрудника.
    command: ["uvicorn", "--factory", "app.panel.server:create_app", "--host", "0.0.0.0", "--port", "8080",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      WEB_HTTPS: "1"  # cookie входа передаётся только по HTTPS
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  proxy:
    # HTTPS для панели: https://partsbot.jacmotors.uz. Сертификаты — в папке ./certs (см. README).
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # WEB_BIND — IP сервера в локальной сети, чтобы панель слушала только её (по умолчанию все адреса)
      - "${WEB_BIND:-0.0.0.0}:80:80"
      - "${WEB_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./nginx/panel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: "<+05>-5"  # время Ташкента (UTC+5)
      BACKUP_TIME: "03:00"
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  postgres_data:
