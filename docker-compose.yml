# Логи каждого контейнера — не больше 5 файлов по 10 МБ (чтобы не заполнить диск)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    # Порт наружу НЕ открываем — база доступна только боту

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/bot/data
      - ./backups:/bot/backups:ro  # чтобы админ мог получить последнюю копию в Telegram
    logging: *logging

  web:
    # Веб-панель: тот же образ, что и бот, другая команда запуска. Только локальная сеть.
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "--factory", "app.panel.server:create_app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      # WEB_BIND — IP сервера в локальной сети (например 192.168.1.10), чтобы панель слушала только её
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: "<+05>-5"  # время Ташкента (UTC+5)
      BACKUP_TIME: "03:00"
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  postgres_data:
